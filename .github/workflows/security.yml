name: Security scan

# Faza 1 (2026-08-14): statik təhlükəsizlik boru xətti — Semgrep (SAST),
# TruffleHog (git tarixçəsi boyu sirr axtarışı), OSV-Scanner (asılılıq CVE),
# OpenSSF Scorecard (repo/supply-chain gigiyenası).
# Nəticələr Security → Code scanning bölməsində toplanır.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # hər bazar ertəsi 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/nextjs \
            --config p/secrets \
            --exclude src/generated --exclude .claude --exclude .next \
            --sarif --output semgrep.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets:
    name: TruffleHog (git tarixçəsi)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # BÜTÜN tarixçə — silinmiş commit-lərdəki sirlər üçün
      - name: Scan repo history
        uses: trufflesecurity/trufflehog@main
        with:
          # 2026-08-17: "unknown" çıxarıldı — .env.example-dakı USER:PASSWORD@HOST
          # placeholder-ləri yalan həyəcan verirdi (Verified:false, exit 183).
          # Yalnız TƏSDİQLƏNMİŞ (işlək) sirr tapılanda fail olur.
          extra_args: --results=verified --json

  deps:
    name: OSV-Scanner (asılılıq CVE)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan lockfile
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.4
        continue-on-error: true
        with:
          scan-args: |-
            --format=sarif
            --output=osv.sarif
            --lockfile=package-lock.json
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: osv.sarif
          category: osv

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: scorecard.sarif
          category: scorecard
