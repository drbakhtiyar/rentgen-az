<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Əlaqə">
  <!-- /elaqe hero (2026-08-16): digər səhifə hero-larının neon üslubu, vektorda.
       Fon ŞƏFFAFDIR — səhifənin iris fonu birbaşa görünür (2026-08-16 düzəlişi:
       qara kvadrat SVG-də blend ilə yox olmurdu). -->
  <defs>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00b1ff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0090e0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0090e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a86d8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#036aad" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feGaussianBlur stdDeviation="26" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="s1"/>
      <feMerge>
        <feMergeNode in="s1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="512" cy="512" r="470" fill="url(#bloom)"/>

  <!-- xarici halqa + bölgü çərtikləri -->
  <g filter="url(#glow)">
    <circle cx="512" cy="512" r="404" fill="none" stroke="#3fc7ff" stroke-width="7" opacity="0.95"/>
  </g>
  <circle cx="512" cy="512" r="372" fill="none" stroke="#7fd9ff" stroke-width="2.5" opacity="0.5"/>
  <g stroke="#8fdcff" stroke-width="3" opacity="0.45" stroke-linecap="round">
    <line x1="512" y1="108" x2="512" y2="142"/>
    <line x1="512" y1="882" x2="512" y2="916"/>
    <line x1="108" y1="512" x2="142" y2="512"/>
    <line x1="882" y1="512" x2="916" y2="512"/>
    <line x1="226" y1="226" x2="250" y2="250"/>
    <line x1="798" y1="226" x2="774" y2="250"/>
    <line x1="226" y1="798" x2="250" y2="774"/>
    <line x1="798" y1="798" x2="774" y2="774"/>
  </g>

  <!-- daxili disk (təsvirin oturduğu səth) -->
  <circle cx="512" cy="512" r="360" fill="#0a7ec4" opacity="0.30"/>

  <!-- mərkəzi zərf -->
  <g filter="url(#glow)">
    <rect x="330" y="392" width="364" height="248" rx="34" fill="url(#plate)" stroke="#5fd2ff" stroke-width="10"/>
    <path d="M348 424 L512 546 L676 424" fill="none" stroke="#7fdcff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M348 612 L452 512" fill="none" stroke="#5fd2ff" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <path d="M676 612 L572 512" fill="none" stroke="#5fd2ff" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- ətrafda kiçik rabitə nişanları -->
  <g filter="url(#softGlow)" fill="none" stroke="#8fdcff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- söhbət qabarcığı (sol yuxarı) -->
    <path d="M232 300 h96 a20 20 0 0 1 20 20 v54 a20 20 0 0 1 -20 20 h-46 l-32 28 v-28 h-18 a20 20 0 0 1 -20 -20 v-54 a20 20 0 0 1 20 -20 z"/>
    <!-- @ işarəsi (sağ yuxarı) -->
    <circle cx="762" cy="332" r="30"/>
    <path d="M792 332 v16 a26 26 0 0 0 26 -26 a56 56 0 1 0 -22 44"/>
    <!-- telefon dəstəyi (sol aşağı) -->
    <path d="M212 690 a26 26 0 0 1 26 -22 h30 l16 46 -24 18 a132 132 0 0 0 62 62 l18 -24 46 16 v30 a26 26 0 0 1 -22 26 a180 180 0 0 1 -152 -152 z"/>
    <!-- mövqe nişanı (sağ aşağı) -->
    <path d="M790 656 a54 54 0 0 1 54 54 c0 40 -54 96 -54 96 s-54 -56 -54 -96 a54 54 0 0 1 54 -54 z"/>
    <circle cx="790" cy="710" r="18"/>
  </g>
</svg>
