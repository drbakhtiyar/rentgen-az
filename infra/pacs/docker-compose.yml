# rentgen.az PACS — pacs.rentgen.az (Hetzner CPX22)
# Secrets come from /opt/pacs/.env on the server (never committed).
services:
  orthanc:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    # OOM guard (2026-08-20: a 1.7GB single-file upload OOM-killed the whole box).
    # Cap Orthanc at 2.5G so the kernel kills only the container, never sshd/caddy.
    mem_limit: 2560m
    memswap_limit: 3584m
    env_file: .env
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc/label-origin.lua:/etc/orthanc/label-origin.lua:ro
      - orthanc-db:/var/lib/orthanc/db
    # 8042 only on the host loopback (admin scripts / ttl-cleanup); public access goes via Caddy.
    # DICOM port 4242 is intentionally NOT published: gateways push over HTTPS peers.
    ports: ["127.0.0.1:8042:8042"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,urllib.error,sys\ntry: urllib.request.urlopen('http://127.0.0.1:8042/system', timeout=4); sys.exit(0)\nexcept urllib.error.HTTPError as e: sys.exit(0 if e.code==401 else 1)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  ohif:
    image: ohif/app:latest
    restart: unless-stopped
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    expose: ["80"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  auth:
    image: node:22-alpine
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      - ./auth/server.mjs:/app/server.mjs:ro
    expose: ["9000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/rx:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [orthanc, ohif, auth]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  orthanc-db:
  caddy-data:
  caddy-config:
